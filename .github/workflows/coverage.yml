name: Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  coverage:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Coverage
        uses: gwatts/go-coverage-action@v2
        with:
          # Measured 86.4% with this action's own invocation
          # (-covermode=count -coverpkg=./...), which reads slightly higher
          # than the 86.3% a plain `go test -coverprofile` gives — different
          # denominator, not a different suite. Threshold sits just under the
          # measured value so a real regression fails but rounding does not.
          coverage-threshold: 86.0
          cover-pkg: ./...
          fail-coverage: always
