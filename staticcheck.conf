# Read by the standalone `staticcheck` binary. Must stay in sync with the
# staticcheck.checks list in .golangci.yml — golangci-lint embeds staticcheck
# but does NOT read this file, so without it the two disagree about what counts
# as a finding.
#
# This is staticcheck's DEFAULT check set (all, minus the ST* class it excludes
# out of the box) plus one subtraction. Writing bare ["all"] instead would be
# stricter than default and re-enable ST1000 "package should have a package
# comment" on every file — 55 findings that golangci-lint silently filters via
# its `comments` exclusion preset, which is precisely the kind of quiet
# disagreement this file exists to prevent.
#
# -ST1003: would rename the exported Logical_Sector_Size field on
#          DiskDevice/RawDevice. This is a published library and that field is
#          already used in 5 places in terraform-provider-truenas; renaming it
#          is a breaking API change, not a lint cleanup. (Also default-off.)
# -S1016:  would rewrite the 12 `fooFromResponse` mappers as struct
#          conversions, permanently coupling each wire-format *Response layout
#          to its user-facing type. That boundary is deliberate. (Not default-off.)
checks = [
  "all",
  "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1023",
  "-S1016",
]
